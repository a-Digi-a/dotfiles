monitors = [ "DP-2" ]

[osd.kinds]
lock_keys = false
media = false

[plugin_settings."noctalia/bitwarden"]
gen_special = true
server_url = "https://vaultwarden.digi-a.org/"

[plugins]
auto_update = "all"
enabled = [ "noctalia/bitwarden", "yuuto/arch-updater" ]

[shell]
corner_radius_scale = 2.0
font_family = "CaskaydiaCove Nerd Font"
polkit_agent = true
screen_time_enabled = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.panel]
    control_center_position = "top_center"

[theme]
builtin = "Eldritch"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "ghostty", "hyprland", "kcolorscheme", "kitty", "qt", "starship" ]
    community_ids = [ "spicetify", "zen-browser", "discord", "libreoffice", "neovim", "obsidian", "steam", "obs", "lazygit", "tmux" ]

[wallpaper.default]
