icon_color = "primary"

[widget.launcher-sysmon-spacer]
length = 16
type = "spacer"

[widget.media]
interactive = false
max_length = 112
title_scroll = "on_hover"

[widget.network]
show_label = false

[widget.ram]
show_label = false

[widget.sysmon]
show_value = false

[widget.temp]
show_label = false

[widget.tray]
